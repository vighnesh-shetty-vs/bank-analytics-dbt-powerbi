name: bank_analytics
version: "1.0.0"
config-version: 2
profile: bank_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Berka data ends on 1998-12-31; "as of" date for ages and tenures
  as_of_date: "1999-01-01"

models:
  bank_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
